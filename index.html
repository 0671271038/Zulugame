let obsList=[];
let player=document.getElementById("player"),game=document.getElementById("game");
let scoreEl=document.getElementById("score"),livesUI=document.getElementById("livesUI"),coinCount=document.getElementById("coinCount");

function loadProgress(){
 coins=parseInt(localStorage.getItem("zulu_coins")||0);
 lives=parseInt(localStorage.getItem("zulu_lives")||MAX_LIVES);
 let lastTime=parseInt(localStorage.getItem("zulu_lastTime")||Date.now());

 if(lives<MAX_LIVES){

 }

   let pR=player.getBoundingClientRect(), cR=c.getBoundingClientRect();
   if(pR.left<cR.right && http://pR.right>cR.left && http://pR.top<cR.bottom && http://pR.bottom>cR.top){
     http://c.remove(); clearInterval(mv); coins++; coinsForLife++; score+=5; http://scoreEl.innerText="AMANDLA: "+score; createParticles(8, http://cR.left, http://cR.top, "🪙"); updateUI();
     if(coinsForLife>=50){ // 1UP from coins
       if(lives<MAX_LIVES){ lives++; createParticles(15, http://pR.left, http://pR.top, "❤️"); } 
       coinsForLife=0; updateUI();
       // bonus flash
       http://document.body.animate([{background:"#FFD700"},{background:"#FF9A3C"}],{duration:300});
     }
   }
 },16);
 if(gameRunning) setTimeout(spawnCoin, 600+Math.random()_800);
}
function spawnOneUp(){
 if(!gameRunning) return;
 if(Math.random()<0.4){ // 40% chance
   let h=document.createElement("div"); http://h.className="oneup"; http://h.innerText="❤️"; http://h.style.left=window.innerWidth+"px"; http://h.style.bottom=(25+20+Math.random()_20)+"%"; http://game.appendChild(h);
   let mv=setInterval(()=>{
     if(!gameRunning){ clearInterval(mv); http://h.remove(); return; }
     let l=parseInt(h.style.left); http://h.style.left=(l-speed)+"px";
     if(l< -50){ http://h.remove(); clearInterval(mv); }
     let pR=player.getBoundingClientRect(), hR=h.getBoundingClientRect();
     if(pR.left<hR.right && http://pR.right>hR.left && http://pR.top<hR.bottom && http://pR.bottom>hR.top){
       http://h.remove(); clearInterval(mv);
       if(lives<MAX_LIVES){ lives++; updateUI(); createParticles(20, http://hR.left, http://hR.top, "❤️"); } else { score+=50; http://scoreEl.innerText="AMANDLA: "+score; }
     }
   },16);
 }
 if(gameRunning) setTimeout(spawnOneUp, 10000+Math.random()_10000);
}
function loseLife(){
 if(invincible) return;
 lives--; updateUI(); http://player.classList.add("hit"); invincible=true; createParticles(10, 60, http://window.innerHeight_0.6, "💔");
 setTimeout(()=>{ http://player.classList.remove("hit"); invincible=false; },1000);
 if(lives<=0){ http://localStorage.setItem("zulu_lastTime",Date.now()); gameRunning=false; setTimeout(()=>{ alert("Wafa! Warriors exhausted!\nScore: "+score+"\nCoins: "+coins+"\n\n10min = 1❤️\n50 coins = BUY 1❤️"); showNoLives(); },300); }
 else { if(lives==MAX_LIVES-1) http://localStorage.setItem("zulu_lastTime",Date.now()); }
}
