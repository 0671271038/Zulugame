<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<title>Zulu Runner</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;font-family:Arial Black}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#ff8c42 0%, #87CEEB 55%)}
#ground{position:absolute;bottom:0;width:100%;height:25%;background:#2ecc71;border-top:12px solid #27ae60;z-index:1}
#player{position:absolute;left:40px;width:50px;height:60px;bottom:25%;z-index:5}
.head{width:28px;height:28px;background:#8B5A2B;border-radius:50%;margin:0 auto;margin-top:-8px}
.hat{width:34px;height:10px;background:#D2A24A;margin:0 auto}
.body{width:32px;height:20px;background:#8B5A2B;margin:0 auto;position:relative}
.shield{position:absolute;right:-16px;top:-5px;width:14px;height:28px;background:#8B4513;border:2px solid #5D3311}
.beads{width:24px;height:5px;background:red;margin:2px auto}
.leg{position:absolute;bottom:-18px;width:6px;height:18px;background:#6B4226;animation:run 0.3s infinite alternate}
.leg1{left:8px} .leg2{right:8px;animation-delay:0.15s}
@keyframes run{from{transform:rotate(-15deg)} to{transform:rotate(15deg)}}
.obs{position:absolute;bottom:25%;width:32px;height:42px;background:#3e2723;z-index:2;border-radius:3px 3px 0 0}
.coin{position:absolute;width:22px;height:22px;background:#FFD700;border:3px solid #FFA500;border-radius:50%;z-index:2}
.spear{position:absolute;width:26px;height:4px;background:#111;z-index:3}
.spear::after{content:"";position:absolute;right:-8px;top:-4px;border-left:10px solid #111;border-top:6px solid transparent;border-bottom:6px solid transparent}
#ui{position:absolute;top:0;left:0;width:100%;display:flex;justify-content:space-between;padding:8px 12px;box-sizing:border-box;color:white;text-shadow:2px 2px 0 #000;z-index:10;font-size:18px}
#btn{position:absolute;bottom:15px;right:15px;width:85px;height:85px;border-radius:50%;background:#e74c3c;border:4px solid white;color:white;font-weight:bold;z-index:20;font-size:15px;box-shadow:0 4px 0 #000}
.jump{animation: jumpAnim 0.55s linear}
@keyframes jumpAnim{0%{bottom:25%} 50%{bottom:60%} 100%{bottom:25%}}
</style>
</head>
<body>
<div id="game">
 <div id="ui"><span id="score">AMANDLA: 0</span><span id="sp">SPEAR x3</span></div>
 <div id="ground"></div>
 <div id="player"><div class="hat"></div><div class="head"></div><div class="body"><div class="shield"></div><div class="beads"></div></div><div class="leg leg1"></div><div class="leg leg2"></div></div>
 <button id="btn">THROW</button>
</div>
<script>
let score=0, spears=3, jumping=false, speed=5;
let player=document.getElementById("player"), game=document.getElementById("game");
let scoreEl=document.getElementById("score"), spEl=document.getElementById("sp");
let obsList=[], coinList=[], spearList=[];

function jump(){ if(jumping) return; jumping=true; player.classList.add("jump"); setTimeout(()=>{player.classList.remove("jump"); jumping=false;},550); }
game.addEventListener("touchstart", e=>{ if(e.target.id!="btn") jump(); });
game.addEventListener("mousedown", e=>{ if(e.target.id!="btn") jump(); });

document.getElementById("btn").addEventListener("touchstart", throwSpear);
document.getElementById("btn").addEventListener("click", throwSpear);

function throwSpear(e){
 e.stopPropagation();
 if(spears<=0) return;
 spears--; spEl.innerText="SPEAR x"+spears;
 let s=document.createElement("div"); s.className="spear";
 let pTop=player.getBoundingClientRect().top;
 let gTop=document.getElementById("ground").getBoundingClientRect().top;
 s.style.left="90px"; s.style.bottom=(window.innerHeight - gTop + 20)+"px";
 game.appendChild(s); spearList.push(s);
 let mv=setInterval(()=>{
   let l=parseInt(s.style.left); s.style.left=(l+12)+"px";
   if(l>window.innerWidth){ s.remove(); clearInterval(mv); }
   obsList.forEach((o,i)=>{
     let oR=o.getBoundingClientRect(), sR=s.getBoundingClientRect();
     if(sR.left < oR.right && sR.right > oR.left && sR.top < oR.bottom && sR.bottom > oR.top){
       o.remove(); obsList.splice(i,1); s.remove(); clearInterval(mv); score+=15; updateScore();
     }
   });
 },16);
}

function updateScore(){ scoreEl.innerText="AMANDLA: "+score; spEl.innerText="SPEAR x"+spears; }

function spawnObs(){
 let o=document.createElement("div"); o.className="obs"; o.style.left="100%"; game.appendChild(o); obsList.push(o);
 let mv=setInterval(()=>{
   let l=parseInt(o.style.left); if(isNaN(l)) l=window.innerWidth;
   o.style.left=(l-speed)+"px";
   if(l< -40){ o.remove(); clearInterval(mv); obsList=obsList.filter(x=>x!=o); score+=10; if(score%50==0) speed+=0.5; updateScore(); }
   let pR=player.getBoundingClientRect(), oR=o.getBoundingClientRect();
   if(pR.left < oR.right-10 && pR.right > oR.left+10 && pR.bottom > oR.top+10 && !jumping){
     alert("Wafa! Final Score: "+score); location.reload();
   }
 },16);
}

function spawnCoin(){
 let c=document.createElement("div"); c.className="coin";
 c.style.left="100%"; c.style.bottom=(25+12+Math.random()*20)+"%"; game.appendChild(c); coinList.push(c);
 let mv=setInterval(()=>{
   let l=parseInt(c.style.left); c.style.left=(l-speed)+"px";
   if(l< -30){ c.remove(); clearInterval(mv); }
   let pR=player.getBoundingClientRect(), cR=c.getBoundingClientRect();
   if(pR.left < cR.right && pR.right > cR.left && pR.top < cR.bottom && pR.bottom > cR.top){
     c.remove(); clearInterval(mv); score+=5; updateScore();
   }
 },16);
}

setInterval(spawnObs, 1400);
setInterval(spawnCoin, 2000);
setInterval(()=>{ if(spears<3){ spears=3; updateScore(); } }, 8000);
spawnObs();
</script>
</body>
</html>
