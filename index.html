<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<title>Zulu Runner - 5 Lives</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;font-family:Arial Black}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#ff8c42 0%, #87CEEB 55%)}
#ground{position:absolute;bottom:0;width:100%;height:25%;background:#2ecc71;border-top:12px solid #27ae60;z-index:1}
#player{position:absolute;left:40px;width:50px;height:60px;bottom:25%;z-index:5}
.head{width:28px;height:28px;background:#8B5A2B;border-radius:50%;margin:0 auto;margin-top:-8px}
.hat{width:34px;height:10px;background:#D2A24A;margin:0 auto}
.body{width:32px;height:20px;background:#8B5A2B;margin:0 auto;position:relative}
.shield{position:absolute;right:-16px;top:-5px;width:14px;height:28px;background:#8B4513;border:2px solid #5D3311}
.beads{width:24px;height:5px;background:red;margin:2px auto}
.leg{position:absolute;bottom:-18px;width:6px;height:18px;background:#6B4226;animation:run 0.3s infinite alternate}
.leg1{left:8px} .leg2{right:8px;animation-delay:0.15s}
@keyframes run{from{transform:rotate(-15deg)} to{transform:rotate(15deg)}}
.obs{position:absolute;bottom:25%;width:32px;height:42px;background:#3e2723;z-index:2;border-radius:3px 3px 0 0}
.coin{position:absolute;width:22px;height:22px;background:#FFD700;border:3px solid #FFA500;border-radius:50%;z-index:2}
.spear{position:absolute;width:26px;height:4px;background:#111;z-index:3}
.spear::after{content:"";position:absolute;right:-8px;top:-4px;border-left:10px solid #111;border-top:6px solid transparent;border-bottom:6px solid transparent}
#ui{position:absolute;top:0;left:0;width:100%;display:flex;justify-content:space-between;padding:8px 12px;box-sizing:border-box;color:white;text-shadow:2px 2px 0 #000;z-index:10;font-size:16px}
#btn{position:absolute;bottom:15px;right:15px;width:85px;height:85px;border-radius:50%;background:#e74c3c;border:4px solid white;color:white;font-weight:bold;z-index:20;font-size:15px;box-shadow:0 4px 0 #000}
.jump{animation:jumpAnim 0.55s linear}
@keyframes jumpAnim{0%{bottom:25%}50%{bottom:58%}100%{bottom:25%}}
.hit{animation:hitFlash 0.5s}
@keyframes hitFlash{0%,50%,100%{opacity:1}25%,75%{opacity:0.2}}
#startScreen, #noLivesScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;text-align:center;padding:20px;box-sizing:border-box}
#startScreen button, #noLivesScreen button{padding:15px 30px;font-size:20px;background:#ff8c42;border:3px solid white;color:white;border-radius:10px;font-weight:bold;margin-top:10px}
#timer{font-size:32px;color:#FFD700;margin:15px 0}
</style>
</head>
<body>
<div id="game">
 <div id="ui"><span id="livesUI">❤️❤️❤️❤️❤️</span><span id="score">AMANDLA: 0</span><span id="sp">SPEAR x3</span></div>
 <div id="ground"></div>
 <div id="player"><div class="hat"></div><div class="head"></div><div class="body"><div class="shield"></div><div class="beads"></div></div><div class="leg leg1"></div><div class="leg leg2"></div></div>
 <button id="btn">THROW</button>
 
 <div id="startScreen">
   <h1 style="margin:5px">ZULU RUNNER</h1>
   <p id="livesText">5 Lives</p>
   <p style="font-size:12px">Tap to Jump, Button to Throw</p>
   <button onclick="startGame()">QALA! (START)</button>
   <p style="font-size:11px;margin-top:15px;opacity:0.7">Lives refill: 10min per heart<br>50min for full</p>
 </div>

 <div id="noLivesScreen" style="display:none">
   <h1>WAFA! NO LIVES!</h1>
   <p>Your warriors need to rest</p>
   <div id="timer">10:00</div>
   <p id="refillInfo">Next life in...</p>
   <p id="fullRefillInfo" style="font-size:12px;opacity:0.7"></p>
   <button onclick="checkLives()">CHECK AGAIN</button>
 </div>
</div>

<script>
let score=0,spears=3,jumping=false,speed=5,gameRunning=false,lives=5;
const MAX_LIVES=5;
const REGEN_TIME=10*60*1000; // 10 minutes in ms
let obsList=[], invincible=false;

let player=document.getElementById("player"),game=document.getElementById("game");
let scoreEl=document.getElementById("score"),spEl=document.getElementById("sp"),livesUI=document.getElementById("livesUI");
let startScreen=document.getElementById("startScreen"),noLivesScreen=document.getElementById("noLivesScreen");

function loadLives(){
 let savedLives=localStorage.getItem("zulu_lives");
 let lastTime=parseInt(localStorage.getItem("zulu_lastTime") || Date.now());
 let now=Date.now();
 
 if(savedLives===null){
   lives=MAX_LIVES;
 } else {
   lives=parseInt(savedLives);
   let elapsed=now-lastTime;
   if(lives<MAX_LIVES){
     let livesToAdd=Math.floor(elapsed/REGEN_TIME);
     if(livesToAdd>0){
       lives=Math.min(MAX_LIVES, lives+livesToAdd);
       lastTime+=livesToAdd*REGEN_TIME;
       localStorage.setItem("zulu_lastTime", lastTime);
       localStorage.setItem("zulu_lives", lives);
     }
   }
 }
 if(lives<0) lives=0;
 updateLivesUI();
 if(lives<=0){
   showNoLivesScreen();
 }
}

function updateLivesUI(){
 let hearts="❤️".repeat(lives) + "🖤".repeat(MAX_LIVES-lives);
 livesUI.innerText=hearts;
 document.getElementById("livesText").innerText=hearts+" ("+lives+"/"+MAX_LIVES+")";
 localStorage.setItem("zulu_lives", lives);
 if(lives<MAX_LIVES && !localStorage.getItem("zulu_lastTime")){
   localStorage.setItem("zulu_lastTime", Date.now());
 }
 if(lives>=MAX_LIVES){
   localStorage.removeItem("zulu_lastTime");
 }
}

function showNoLivesScreen(){
 startScreen.style.display="none";
 noLivesScreen.style.display="flex";
 startTimer();
}

function startTimer(){
 let lastTime=parseInt(localStorage.getItem("zulu_lastTime") || Date.now());
 function updateTimer(){
   let now=Date.now();
   let elapsed=now-lastTime;
   let remaining=REGEN_TIME-(elapsed%REGEN_TIME);
   if(remaining<0) remaining=REGEN_TIME;
   
   let livesNow=parseInt(localStorage.getItem("zulu_lives")||0);
   let totalRemaining=(MAX_LIVES-livesNow-1)*REGEN_TIME + remaining;
   
   let mins=Math.floor(remaining/60000);
   let secs=Math.floor((remaining%60000)/1000);
   document.getElementById("timer").innerText=mins.toString().padStart(2,"0")+":"+secs.toString().padStart(2,"0");
   document.getElementById("refillInfo").innerText="Next life in: "+mins+"m "+secs+"s";
   document.getElementById("fullRefillInfo").innerText="Full refill (5 lives) in: "+Math.ceil(totalRemaining/60000)+" minutes";
   
   if(remaining<=1000){
     checkLives();
   }
 }
 updateTimer();
 setInterval(updateTimer,1000);
}

function checkLives(){
 loadLives();
 if(lives>0){
   noLivesScreen.style.display="none";
   startScreen.style.display="flex";
 }
}

function loseLife(){
 if(invincible) return;
 lives--;
 updateLivesUI();
 player.classList.add("hit");
 invincible=true;
 setTimeout(()=>{ player.classList.remove("hit"); invincible=false; },1000);
 
 if(lives<=0){
   localStorage.setItem("zulu_lastTime", Date.now());
   gameRunning=false;
   setTimeout(()=>{
     alert("Wafa! All lives finished! Final Score: "+score+"\nCome back in 10 minutes for 1 life.\n50 minutes for full 5 lives.");
     showNoLivesScreen();
   },200);
 } else {
   if(lives==MAX_LIVES-1){
     localStorage.setItem("zulu_lastTime", Date.now());
   }
 }
}

loadLives();

function startGame(){
 if(lives<=0){ showNoLivesScreen(); return; }
 startScreen.style.display="none";
 gameRunning=true;
 score=0; speed=5;
 scoreEl.innerText="AMANDLA: 0";
 setTimeout(spawnObs,1000);
 setInterval(spawnCoin,2500);
}

function jump(){ if(jumping||!gameRunning) return; jumping=true; player.classList.add("jump"); setTimeout(()=>{player.classList.remove("jump"); jumping=false;},550); }
game.addEventListener("touchstart",e=>{ if(e.target.id!="btn" && !e.target.closest("#startScreen") && !e.target.closest("#noLivesScreen")) jump(); });
document.getElementById("btn").addEventListener("click",throwSpear);

function throwSpear(e){
 if(!gameRunning) return;
 e.stopPropagation();
 if(spears<=0) return;
 spears--; spEl.innerText="SPEAR x"+spears;
 let s=document.createElement("div"); s.className="spear"; s.style.left="90px"; s.style.bottom="calc(25% + 20px)"; game.appendChild(s);
 let mv=setInterval(()=>{
   let l=parseInt(s.style.left); s.style.left=(l+12)+"px";
   if(l>window.innerWidth){ s.remove(); clearInterval(mv); }
   obsList.forEach((o,i)=>{
     let oR=o.getBoundingClientRect(), sR=s.getBoundingClientRect();
     if(sR.left < oR.right && sR.right > oR.left && sR.top < oR.bottom && sR.bottom > oR.top){
       o.remove(); obsList.splice(i,1); s.remove(); clearInterval(mv); score+=15; scoreEl.innerText="AMANDLA: "+score;
     }
   });
 },16);
}

function spawnObs(){
 if(!gameRunning) return;
 let o=document.createElement("div"); o.className="obs"; o.style.left=window.innerWidth+"px"; game.appendChild(o); obsList.push(o);
 let mv=setInterval(()=>{
   if(!gameRunning){ clearInterval(mv); return; }
   let l=parseInt(o.style.left); if(isNaN(l)) l=window.innerWidth;
   o.style.left=(l-speed)+"px";
   if(l< -40){ o.remove(); clearInterval(mv); obsList=obsList.filter(x=>x!=o); score+=10; scoreEl.innerText="AMANDLA: "+score; if(score%50==0) speed+=0.3; }
   if(l < 90 && l > 20 && !jumping && !invincible){
     let pBottom=parseInt(window.getComputedStyle(player).bottom);
     if(pBottom < 35){
       o.remove(); clearInterval(mv); obsList=obsList.filter(x=>x!=o);
       loseLife();
     }
   }
 },16);
 if(gameRunning) setTimeout(spawnObs, 1400 + Math.random()*800);
}

function spawnCoin(){
 if(!gameRunning) return;
 let c=document.createElement("div"); c.className="coin"; c.style.left=window.innerWidth+"px"; c.style.bottom=(25+15+Math.random()*15)+"%"; game.appendChild(c);
 let mv=setInterval(()=>{
   let l=parseInt(c.style.left); c.style.left=(l-speed)+"px";
   if(l< -30){ c.remove(); clearInterval(mv); }
   let pR=player.getBoundingClientRect(), cR=c.getBoundingClientRect();
   if(pR.left < cR.right && pR.right > cR.left && pR.top < cR.bottom && pR.bottom > cR.top){
     c.remove(); clearInterval(mv); score+=5; scoreEl.innerText="AMANDLA: "+score;
   }
 },16);
}
setInterval(()=>{ if(spears<3 && gameRunning){ spears=3; spEl.innerText="SPEAR x"+spears; } },8000);
</script>
</body>
</html>
