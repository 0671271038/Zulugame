<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zulu Runner FIXED</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:#FF8C42;font-family:Arial Black}
#game{position:relative;width:100vw;height:100vh;background:linear-gradient(to bottom,#FF8C42 0%,#87CEEB 60%);overflow:hidden}
#ground{position:absolute;bottom:0;width:100%;height:26%;background:#2ecc71;border-top:8px solid #27ae60;z-index:1}
#player{position:absolute;left:25px;width:50px;height:65px;bottom:26%;z-index:10;background:transparent}
#player .hat{width:36px;height:10px;background:#D2A24A;margin:0 auto}
#player .head{width:30px;height:30px;background:#8B5A2B;border-radius:50%;margin:0 auto}
#player .body{width:34px;height:22px;background:#8B5A2B;margin:2px auto;position:relative}
#player .shield{position:absolute;right:-12px;top:0;width:12px;height:26px;background:#5D4037;border:2px solid #000}
#player .legs{display:flex;justify-content:space-around;margin-top:2px}
#player .leg{width:7px;height:16px;background:#6B4226}
.obs{position:absolute;bottom:26%;width:42px;height:48px;background:#3E2723;border:2px solid #000;border-radius:4px;z-index:5}
.coin{position:absolute;width:26px;height:26px;background:gold;border:2px solid orange;border-radius:50%;z-index:4}
.heart{position:absolute;width:32px;height:32px;background:#ff3b3b;border:2px solid white;border-radius:50%;z-index:4;display:flex;align-items:center;justify-content:center;color:white}
.spear{position:absolute;width:35px;height:5px;background:black;z-index:6}
#ui{position:absolute;top:0;left:0;width:100%;display:flex;justify-content:space-between;padding:8px;box-sizing:border-box;color:white;text-shadow:1px 1px 0 #000;z-index:20;font-size:13px;background:rgba(0,0,0,0.25)}
#btn{position:absolute;bottom:100px;right:18px;width:88px;height:88px;border-radius:50%;background:#e74c3c;border:4px solid white;color:white;font-weight:bold;z-index:30;font-size:13px;box-shadow:0 4px 0 #000}
.jump{animation:jump 0.55s linear}
@keyframes jump{0%{bottom:26%}50%{bottom:62%}100%{bottom:26%}}
.hit{animation:flash 0.3s 3}
@keyframes flash{0%,100%{opacity:1}50%{opacity:0.2}}
#start{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;text-align:center}
#start button{padding:14px 28px;font-size:18px;background:#ff8c42;border:3px solid white;color:white;border-radius:10px;margin-top:12px}
#noLife{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;color:white;text-align:center}
#noLife button{padding:12px 24px;margin:8px;background:#ff8c42;border:2px solid white;color:white;border-radius:8px}
</style>
</head>
<body>
<div id="game">
<div id="ui"><span id="lives">❤️❤️❤️❤️❤️</span><span id="score">AMANDLA: 0 | COIN: 0</span></div>
<div id="ground"></div>
<div id="player"><div class="hat"></div><div class="head"></div><div class="body"><div class="shield"></div></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div>
<button id="btn">THROW</button>
<div id="start">
<h1>ZULU RUNNER</h1>
<p id="liveTxt">❤️❤️❤️❤️❤️</p>
<p style="font-size:12px">50 coins = +1 life ❤️ | Heart = 1UP</p>
<button onclick="startGame()">QALA START</button>
</div>
<div id="noLife">
<h2>NO LIVES!</h2>
<div id="timer" style="font-size:32px;color:gold">10:00</div>
<p id="info"></p>
<button onclick="checkLife()">CHECK LIVES</button>
<button onclick="buyLife()">BUY 50 COINS = 1 LIFE</button>
</div>
</div>
<script>
let score=0,coins=0,need=0,lives=5,jump=false,speed=5,run=false,inv=false;
let obs=[], game=document.getElementById("game"), player=document.getElementById("player");
let scoreE=document.getElementById("score"), livesE=document.getElementById("lives");
const MAX=5, REGEN=10*60*1000;
function load(){
 coins=parseInt(localStorage.getItem("zcoins")||"0");
 let s=localStorage.getItem("zlives");
 let last=parseInt(localStorage.getItem("zlast")||Date.now());
 let now=Date.now();
 if(s==null) lives=MAX;
 else{
  lives=parseInt(s);
  if(lives<MAX){
   let add=Math.floor((now-last)/REGEN);
   if(add>0){ lives=Math.min(MAX,lives+add); last+=add*REGEN; localStorage.setItem("zlast",last); }
  }
 }
 ui();
 if(lives<=0) showNo();
}
function ui(){
 livesE.innerText="❤️".repeat(lives)+"🖤".repeat(MAX-lives);
 document.getElementById("liveTxt").innerText=livesE.innerText+" ("+lives+"/"+MAX+")";
 scoreE.innerText="AMANDLA: "+score+" | COIN: "+coins+" ("+need+"/50)";
 localStorage.setItem("zlives",lives);
 localStorage.setItem("zcoins",coins);
 if(lives<MAX && !localStorage.getItem("zlast")) localStorage.setItem("zlast",Date.now());
 if(lives>=MAX) localStorage.removeItem("zlast");
}
function showNo(){
 document.getElementById("start").style.display="none";
 document.getElementById("noLife").style.display="flex";
 let last=parseInt(localStorage.getItem("zlast")||Date.now());
 setInterval(()=>{
  let now=Date.now(); let rem=REGEN-((now-last)%REGEN);
  let m=Math.floor(rem/60000), s=Math.floor((rem%60000)/1000);
  document.getElementById("timer").innerText=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  document.getElementById("info").innerText="Next life in "+m+"m "+s+"s";
 },1000);
}
function checkLife(){
 let last=parseInt(localStorage.getItem("zlast")||Date.now());
 let now=Date.now();
 let add=Math.floor((now-last)/REGEN);
 if(add>0){ lives=Math.min(MAX,lives+add); localStorage.setItem("zlives",lives); localStorage.setItem("zlast",last+add*REGEN); }
 ui();
 if(lives>0){ document.getElementById("noLife").style.display="none"; document.getElementById("start").style.display="flex"; }
}
function buyLife(){
 if(coins>=50 && lives<MAX){ coins-=50; need=0; lives++; ui(); document.getElementById("noLife").style.display="none"; document.getElementById("start").style.display="flex"; }
 else alert("Need 50 coins, you have "+coins);
}
load();
function startGame(){
 if(lives<=0){ showNo(); return; }
 document.getElementById("start").style.display="none";
 run=true; score=0; speed=5; need=0; obs=[];
 document.querySelectorAll(".obs,.coin,.heart,.spear").forEach(e=>e.remove());
 setTimeout(spawnObs,900);
 setTimeout(spawnCoin,600);
 setTimeout(spawnHeart,6000);
}
function doJump(){
 if(jump||!run) return;
 jump=true; player.classList.add("jump");
 setTimeout(()=>{ player.classList.remove("jump"); jump=false; },550);
}
game.addEventListener("touchstart",e=>{
 if(e.target.id!="btn" && e.target.tagName!="BUTTON") doJump();
});
document.getElementById("btn").addEventListener("touchstart",e=>{ e.preventDefault(); throwSpear(); });
function throwSpear(){
 if(!run) return;
 let s=document.createElement("div"); s.className="spear"; s.style.left="80px"; s.style.bottom="calc(26% + 18px)"; game.appendChild(s);
 let mv=setInterval(()=>{
  let l=parseInt(s.style.left)||80; s.style.left=(l+13)+"px";
  if(l>window.innerWidth){ s.remove(); clearInterval(mv); }
  obs.forEach((o,i)=>{
   if(!o.parentElement) return;
   let a=o.getBoundingClientRect(), b=s.getBoundingClientRect();
   if(b.left < a.right && b.right > a.left && b.top < a.bottom && b.bottom > a.top){
    o.remove(); obs.splice(i,1); s.remove(); clearInterval(mv); score+=15; ui();
   }
  });
 },16);
}
function spawnObs(){
 if(!run) return;
 let o=document.createElement("div"); o.className="obs"; o.style.left=window.innerWidth+"px"; game.appendChild(o); obs.push(o);
 let mv=setInterval(()=>{
  if(!run){ clearInterval(mv); return; }
  let l=parseInt(o.style.left)||window.innerWidth; o.style.left=(l-speed)+"px";
  if(l<-50){ o.remove(); clearInterval(mv); obs=obs.filter(x=>x!=o); score+=10; ui(); if(score%80==0) speed+=0.5; }
  if(!inv && !jump){
   let pr=player.getBoundingClientRect(), or=o.getBoundingClientRect();
   if(pr.right-8 > or.left && pr.left+8 < or.right && pr.bottom-10 > or.top && pr.top+8 < or.bottom){
    o.remove(); clearInterval(mv); obs=obs.filter(x=>x!=o);
    lives--; ui(); player.classList.add("hit"); inv=true;
    setTimeout(()=>{ player.classList.remove("hit"); inv=false; },700);
    if(lives<=0){ localStorage.setItem("zlast",Date.now()); run=false; setTimeout(()=>{ alert("Wafa! Score "+score); showNo(); },150); }
    else if(lives==MAX-1) localStorage.setItem("zlast",Date.now());
   }
  }
 },16);
 if(run) setTimeout(spawnObs, 1200+Math.random()*800);
}
function spawnCoin(){
 if(!run) return;
 let c=document.createElement("div"); c.className="coin"; c.style.left=window.innerWidth+"px"; c.style.bottom=(26+4+Math.random()*18)+"%"; game.appendChild(c);
 let mv=setInterval(()=>{
  if(!run){ c.remove(); clearInterval(mv); return; }
  let l=parseInt(c.style.left)||window.innerWidth; c.style.left=(l-speed)+"px";
  if(l<-40){ c.remove(); clearInterval(mv); return; }
  let pr=player.getBoundingClientRect(), cr=c.getBoundingClientRect();
  if(pr.left < cr.right && pr.right > cr.left && pr.top < cr.bottom && pr.bottom > cr.top){
   c.remove(); clearInterval(mv); coins++; need++; score+=5; ui();
   if(need>=50 && lives<MAX){ lives++; need=0; ui(); }
  }
 },16);
 if(run) setTimeout(spawnCoin, 700+Math.random()*600);
}
function spawnHeart(){
 if(!run) return;
 if(Math.random()<0.5){
  let h=document.createElement("div"); h.className="heart"; h.innerText="❤️"; h.style.left=window.innerWidth+"px"; h.style.bottom=(26+12+Math.random()*15)+"%"; game.appendChild(h);
  let mv=setInterval(()=>{
   if(!run){ h.remove(); clearInterval(mv); return; }
   let l=parseInt(h.style.left)||window.innerWidth; h.style.left=(l-speed)+"px";
   if(l<-50){ h.remove(); clearInterval(mv); return; }
   let pr=player.getBoundingClientRect(), hr=h.getBoundingClientRect();
   if(pr.left < hr.right && pr.right > hr.left && pr.top < hr.bottom && pr.bottom > hr.top){
    h.remove(); clearInterval(mv);
    if(lives<MAX){ lives++; need=0; ui(); } else { score+=25; ui(); }
   }
  },16);
 }
 if(run) setTimeout(spawnHeart, 8000+Math.random()*6000);
}
</script>
</body>
</html>
